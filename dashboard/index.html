<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOS AI · Pusat komando</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🆘</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <header class="top">
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Buka menu" aria-expanded="false" aria-controls="drawer">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="brand"><span class="brand-mark" aria-hidden="true" data-logo>SOS</span><h1>SOS AI</h1></div>
    <div class="net" id="netPill"></div>
    <div class="spacer"></div>
    <button class="btn btn-quiet" id="simulateBtn" type="button" hidden>Simulasi laporan</button>
    <button class="btn btn-wallet" id="walletBtn" type="button">Hubungkan wallet</button>
  </header>

  <div class="backdrop" id="drawerBackdrop"></div>
  <nav class="drawer" id="drawer" aria-label="Menu utama"></nav>

  <main class="grid">
    <section class="left" id="leftPane" aria-label="Peta dan log agent">
      <div id="map" class="map"></div>
      <div class="map-overlay map-tl">
        <div class="target" id="mapTarget" hidden></div>
        <div class="legend" aria-label="Keterangan warna prioritas"><i class="merah"></i>Tinggi<i class="kuning"></i>Sedang<i class="hijau"></i>Rendah</div>
      </div>
      <div class="map-overlay map-tr"><div class="weather" id="mapWeather" hidden></div></div>
      <div class="telemetry">
        <button class="telemetry-head" id="telemetryToggle" type="button" aria-expanded="true" aria-controls="telemetry">
          <span>Log agent</span><span class="chev" aria-hidden="true">▾</span>
        </button>
        <pre class="telemetry-body" id="telemetry" tabindex="0"></pre>
      </div>
    </section>

    <aside class="right" id="right" aria-label="Detail laporan">
      <div id="detail" aria-live="polite"></div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/ethers.umd.min.js"></script>
  <script src="logo.js?v=11"></script>
  <script src="app.js?v=11"></script>
</body>
</html>
